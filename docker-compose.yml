version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: contentnest-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - contentnest

  redis:
    image: redis:7-alpine
    container_name: contentnest-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - contentnest

  api-gateway:
    build: ./services/api-gateway
    container_name: contentnest-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - CONTENT_SERVICE_URL=http://content-service:3002
      - MEDIA_SERVICE_URL=http://media-service:3003
      - SEARCH_SERVICE_URL=http://search-service:3004
      - ANALYTICS_SERVICE_URL=http://analytics-service:3005
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - auth-service
      - content-service
      - media-service
      - search-service
      - analytics-service
    networks:
      - contentnest

  auth-service:
    build: ./services/auth-service
    container_name: contentnest-auth
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/contentnest_auth?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3010}
    depends_on:
      - mongodb
    networks:
      - contentnest

  content-service:
    build: ./services/content-service
    container_name: contentnest-content
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/contentnest_content?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongodb
    networks:
      - contentnest

  media-service:
    build: ./services/media-service
    container_name: contentnest-media
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/contentnest_media?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-cloudinary}
    depends_on:
      - mongodb
    networks:
      - contentnest

  search-service:
    build: ./services/search-service
    container_name: contentnest-search
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/contentnest_content?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongodb
    networks:
      - contentnest

  analytics-service:
    build: ./services/analytics-service
    container_name: contentnest-analytics
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/contentnest_analytics?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongodb
    networks:
      - contentnest

  scheduler-service:
    build: ./services/scheduler-service
    container_name: contentnest-scheduler
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      - PORT=3006
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/contentnest_content?authSource=admin
      - CONTENT_SERVICE_URL=http://content-service:3002
      - JWT_SECRET=${JWT_SECRET}
      - SCHEDULER_TOKEN=${SCHEDULER_TOKEN}
    depends_on:
      - mongodb
      - content-service
    networks:
      - contentnest

  frontend:
    build: ./frontend
    container_name: contentnest-frontend
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      - api-gateway
    networks:
      - contentnest

volumes:
  mongodb_data:

networks:
  contentnest:
    driver: bridge
